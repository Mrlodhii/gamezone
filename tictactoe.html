<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d0a"><title>Tic Tac Toe | Gamezone</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#080d0a;color:#f4fff5;font-family:system-ui,Arial;max-width:600px;margin:auto}.green{color:#53ff75}a{color:#53ff75;text-decoration:none}.top{display:flex;justify-content:space-between}h1{text-align:center;margin:35px 0 8px}.hint{text-align:center;color:#a9b9ac}#status{text-align:center;font-size:19px;color:#53ff75;margin:25px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,390px);margin:auto}.cell{aspect-ratio:1;border-radius:15px;border:1px solid #31563a;background:#132017;color:#53ff75;font-size:clamp(45px,15vw,75px);font-weight:900}.actions{text-align:center;margin:25px}button.reset{padding:12px 24px;background:#53ff75;color:#071109;border:0;border-radius:9px;font-weight:800}</style></head><body><div class="top"><a href="index.html">← GAMEZONE</a><span class="green">2 PLAYERS</span></div><h1>⭕ Tic Tac <span class="green">Toe</span></h1><p class="hint">दोस्त के साथ खेलो — X और O बारी-बारी से लगाओ।</p><div id="status">X की बारी</div><div class="board" id="board"></div><div class="actions"><button class="reset" onclick="reset()">🔄 New Game</button></div><script>let cells,turn,over;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function reset(){cells=Array(9).fill('');turn='X';over=false;document.querySelector('#status').textContent='X की बारी';let b=document.querySelector('#board');b.innerHTML='';cells.forEach((_,i)=>{let x=document.createElement('button');x.className='cell';x.onclick=()=>play(i,x);b.append(x)})}function play(i,x){if(over||cells[i])return;cells[i]=turn;x.textContent=turn;x.style.color=turn==='X'?'#53ff75':'#83c7ff';let win=wins.find(w=>w.every(n=>cells[n]===turn));if(win){over=true;document.querySelector('#status').textContent='🎉 '+turn+' जीत गया!';win.forEach(n=>document.querySelectorAll('.cell')[n].style.background='#24552e');return}if(cells.every(Boolean)){over=true;document.querySelector('#status').textContent='🤝 मैच ड्रॉ!';return}turn=turn==='X'?'O':'X';document.querySelector('#status').textContent=turn+' की बारी'}reset()</script></body></html>
