<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d0a"><title>100 Mini Games | Gamezone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d0a;color:#f4fff5;font-family:system-ui,Arial,sans-serif}.wrap{width:min(1100px,94%);margin:auto}.top{padding:18px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263d2b}.top a{color:#53ff75;text-decoration:none}.hero{text-align:center;padding:35px 0 20px}.hero h1{font-size:clamp(30px,6vw,52px);margin:10px}.green{color:#53ff75}.muted{color:#a9b9ac}.search{display:flex;gap:10px;margin:20px 0}.search input{min-width:0;flex:1;padding:13px;border:1px solid #31563a;border-radius:10px;background:#101a13;color:white;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 16px;background:#53ff75;color:#071109;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,#132017,#0b100d);border:1px solid #263d2b;border-radius:13px;padding:14px;min-width:0}.card .emoji{font-size:30px}.card h3{font-size:15px;margin:6px 0}.card p{font-size:12px;color:#a9b9ac;min-height:32px;margin:0 0 12px}.card button{width:100%;padding:9px;font-size:12px}.panel{display:none;margin:22px 0;padding:20px;border:1px solid #327e43;border-radius:16px;background:#101a13}.panel h2{margin-top:0}.gamearea{min-height:130px;display:grid;place-items:center;text-align:center;padding:12px}.big{font-size:clamp(28px,8vw,52px);font-weight:900}.choice{padding:13px;margin:5px;border-radius:9px;border:1px solid #31563a;background:#132017;color:#53ff75;font-size:18px;cursor:pointer}.feedback{color:#53ff75;min-height:28px;margin:10px}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.tap{width:100%;min-height:90px;font-size:24px}.back{background:transparent;color:#53ff75;border:1px solid #53ff75}.foot{text-align:center;color:#a9b9ac;padding:30px 0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="top"><a href="index.html">← GAMEZONE</a><span class="green">100 MINI GAMES</span></div>
<section class="hero"><div class="green">🎮 ARCADE COLLECTION</div><h1>100 <span class="green">GAMES</span></h1><p class="muted">अपना गेम चुनो, खेलो और अपना बेस्ट स्कोर बनाओ। मोबाइल पर भी चलता है।</p></section>
<div class="search"><input id="search" placeholder="गेम खोजो..." aria-label="Search games"><button class="btn" onclick="document.getElementById('search').value='';filterGames()">सभी</button></div>
<section class="panel" id="panel"><button class="btn back" onclick="closeGame()">← गेम लिस्ट</button><h2 id="gameTitle"></h2><p id="gameDesc" class="muted"></p><div id="gamearea" class="gamearea"></div><div id="feedback" class="feedback" role="status"></div><div class="row"><button class="btn" id="restart" onclick="startGame()">🔄 फिर से खेलो</button></div></section>
<div id="grid" class="grid"></div><div class="foot">Gamezone · 100 browser mini-games · बिना अलग ऐप के खेलो</div></div>
<script>
const base=[
['🎯','Target Tap','जितनी जल्दी हो सके टारगेट टैप करो।','tap'],
['🧠','Memory Flash','दिखाए गए नंबर याद रखो।','memory'],
['🔢','Number Guess','छिपा हुआ नंबर खोजो।','guess'],
['➕','Math Sprint','जल्दी से गणित का जवाब दो।','math'],
['✊','Rock Paper Scissors','कंप्यूटर के खिलाफ खेलो।','rps'],
['🎨','Color Match','सही रंग चुनो।','color'],
['⚡','Reaction Test','GO दिखते ही टैप करो।','reaction'],
['⌨️','Typing Challenge','दिया गया शब्द टाइप करो।','typing'],
['🔼','Higher or Lower','अगला नंबर बड़ा है या छोटा?','higher'],
['🍀','Lucky Pick','सही बॉक्स चुनकर पॉइंट कमाओ।','lucky']
];
const names=['Classic','Speed','Pro','Neon','Turbo','Brain','Lucky','Challenge','Master','Ultimate'];
const games=Array.from({length:100},(_,i)=>{let b=base[i%10],tier=Math.floor(i/10);return {id:i+1,title:b[1]+' '+names[tier],desc:b[2],type:b[3],emoji:b[0],level:tier+1}});
let current=null,score=0,timer=null,answer=null,started=0,tries=0;
const $=id=>document.getElementById(id);
function render(){let q=$('search').value.toLowerCase();$('grid').innerHTML='';games.filter(g=>(g.title+' '+g.desc+' '+g.id).toLowerCase().includes(q)).forEach(g=>{let a=document.createElement('article');a.className='card';a.innerHTML='<div class="emoji">'+g.emoji+'</div><h3>'+g.id+'. '+g.title+'</h3><p>'+g.desc+'</p><button class="btn">▶ PLAY</button>';a.querySelector('button').onclick=()=>openGame(g);$('grid').append(a)})}
function filterGames(){render()}$('search').addEventListener('input',render);
function openGame(g){current=g;score=0;tries=0;$('panel').style.display='block';$('gameTitle').textContent=g.emoji+' '+g.id+'. '+g.title;$('gameDesc').textContent=g.desc+' Level '+g.level;$('feedback').textContent='';$('panel').scrollIntoView({behavior:'smooth',block:'start'});startGame()}
function closeGame(){clearInterval(timer);$('panel').style.display='none';current=null}
function feedback(s){$('feedback').textContent=s}
function startGame(){if(!current)return;clearInterval(timer);score=0;tries=0;$('feedback').textContent='';let a=$('gamearea');a.innerHTML='';const button=(label,fn,cls='choice')=>{let b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;a.append(b);return b};
switch(current.type){
case'tap':{let n=0;let b=button('🎯 TAP ME',()=>{n++;b.textContent='🎯 '+n+' taps';feedback('Score: '+n)},'btn tap');feedback('30 सेकंड में जितने हो सकें टैप करो!');let end=Date.now()+30000;timer=setInterval(()=>{if(Date.now()>=end){clearInterval(timer);b.disabled=true;feedback('समय पूरा! आपका स्कोर: '+n)}},250);break}
case'memory':{let nums=Array.from({length:3+Math.min(5,current.level)},()=>Math.floor(Math.random()*9)+1);a.innerHTML='<div><div class="muted">याद रखो:</div><div class="big" id="mem">'+nums.join(' ')+'</div><div id="meminput" style="margin-top:12px"></div></div>';setTimeout(()=>{if(!current||current.type!=='memory')return;$('mem').textContent='? ? ?';$('meminput').innerHTML='<input id="memans" inputmode="numeric" placeholder="नंबर बिना स्पेस लिखो" style="padding:12px;max-width:100%;width:240px"> <button class="btn" id="memcheck">Check</button>';$('memcheck').onclick=()=>feedback($('memans').value.replace(/\s/g,'')===nums.join('')?'सही! शानदार याददाश्त!':'सही क्रम था: '+nums.join(' '))},2500);feedback('नंबर 2.5 सेकंड याद रखो।');break}
case'guess':{answer=Math.floor(Math.random()*(10+current.level*5))+1;a.innerHTML='<div><div class="big">🔢 ?</div><p>1 से '+(10+current.level*5)+' के बीच नंबर</p><input id="guess" type="number" inputmode="numeric" style="padding:12px;width:120px" placeholder="नंबर"><button class="btn" id="gbtn">Guess</button></div>';$('gbtn').onclick=()=>{let v=+$('guess').value;tries++;if(v===answer)feedback('🎉 सही जवाब! कोशिशें: '+tries);else feedback(v<answer?'और बड़ा नंबर ट्राय करो।':'और छोटा नंबर ट्राय करो।')};break}
case'math':{let x=Math.floor(Math.random()*20*current.level)+1,y=Math.floor(Math.random()*15)+1,op=Math.random()<.5?'+':'−';answer=op==='+'?x+y:x-y;a.innerHTML='<div><div class="big">'+x+' '+op+' '+y+' = ?</div><input id="mathans" type="number" inputmode="numeric" placeholder="जवाब" style="padding:12px;width:130px"><button class="btn" id="mathbtn">Check</button></div>';$('mathbtn').onclick=()=>feedback(+$('mathans').value===answer?'✅ बिल्कुल सही!':'फिर कोशिश करो!');break}
case'rps':{['✊ पत्थर','✋ कागज़','✌️ कैंची'].forEach((v,i)=>button(v,()=>{let c=Math.floor(Math.random()*3);let res=i===c?'ड्रॉ!':(i-c+3)%3===1?'तुम जीते!':'कंप्यूटर जीता!';feedback('कंप्यूटर: '+['पत्थर','कागज़','कैंची'][c]+' — '+res)}));break}
case'color':{let colors=[['लाल','#ff5d5d'],['हरा','#53ff75'],['नीला','#62a8ff'],['पीला','#ffe066']];let c=colors[Math.floor(Math.random()*4)];answer=c[0];a.innerHTML='<div><div class="big" style="color:'+c[1]+'">●</div><div>इस रंग का नाम चुनो</div></div>';colors.sort(()=>Math.random()-.5).forEach(v=>button(v[0],()=>feedback(v[0]===answer?'सही रंग! 🎉':'फिर कोशिश करो।')));break}
case'reaction':{let b=button('WAIT…',()=>{},'btn tap');b.disabled=true;feedback('हरे GO बटन के आने तक इंतज़ार करो।');let delay=1000+Math.random()*3500;timer=setTimeout(()=>{if(!current)return;let t=Date.now();b.disabled=false;b.textContent='🟢 GO!';b.onclick=()=>{b.disabled=true;feedback('Reaction time: '+(Date.now()-t)+' ms')};},delay);break}
case'typing':{let words=['gamezone','computer','rocket','puzzle','winner','challenge','memory','speed','player','awesome'];let word=words[Math.floor(Math.random()*words.length)];a.innerHTML='<div><div class="big">'+word+'</div><input id="typeans" placeholder="ऊपर का शब्द टाइप करो" style="padding:12px;width:min(260px,95%)"><button class="btn" id="typebtn">Check</button></div>';$('typebtn').onclick=()=>feedback($('typeans').value.trim()===word?'सही टाइप किया!':'स्पेलिंग मिलाकर फिर कोशिश करो।');break}
case'higher':{let n=Math.floor(Math.random()*50)+1;a.innerHTML='<div><div class="big" id="hnum">'+n+'</div><p>अगला नंबर इससे बड़ा होगा या छोटा?</p></div>';let actual=Math.random()<.5?'higher':'lower';button('🔼 Higher',()=>{let next=n+(actual==='higher'?1:-1)*(1+Math.floor(Math.random()*10));feedback(next>n?'सही अनुमान! अगला: '+next:'गलत अनुमान। अगला: '+next)});button('🔽 Lower',()=>{let next=n+(actual==='lower'?-1:1)*(1+Math.floor(Math.random()*10));feedback(next<n?'सही अनुमान! अगला: '+next:'गलत अनुमान। अगला: '+next)});break}
case'lucky':{let win=Math.floor(Math.random()*3);[0,1,2].forEach(i=>button(['📦 बॉक्स 1','📦 बॉक्स 2','📦 बॉक्स 3'][i],()=>{a.querySelectorAll('button').forEach(b=>b.disabled=true);feedback(i===win?'🎉 लकी! पॉइंट मिला!':'इस बार नहीं। सही बॉक्स '+(win+1)+' था।')}));break}
}
}
render();
</script></body></html>
