<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080916"><title>Gamezone — Play Mini Games</title>
<style>
:root{--bg:#080916;--panel:#14162d;--cyan:#50f5e2;--purple:#9b7bff;--text:#f7f7ff;--muted:#b8bbd4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21184b,var(--bg) 55%);color:var(--text);font:16px system-ui,Arial}.wrap{width:min(1100px,94%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #34345c}.logo{font-size:22px;font-weight:900;color:white;text-decoration:none}.logo span{color:var(--cyan)}a{color:var(--cyan)}h1{font-size:clamp(30px,6vw,48px);margin:25px 0 8px}.muted{color:var(--muted)}.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card{background:linear-gradient(145deg,#191b3a,#101225);border:1px solid #39385e;border-radius:15px;padding:14px;min-height:130px;display:flex;flex-direction:column;gap:7px}.emoji{font-size:29px}.card b{font-size:15px}.btn,button{border:0;border-radius:9px;background:linear-gradient(110deg,var(--cyan),#b2fff4);color:#090a19;font-weight:850;padding:11px 14px;cursor:pointer;font-size:15px}.card .btn{margin-top:auto}.panel{display:none;background:#12142b;border:1px solid #39385e;border-radius:18px;padding:17px;margin:22px 0}.panel.show{display:block}.gamearea{min-height:180px;padding:14px 0}.gamearea button{margin:5px}.gamearea input{padding:10px;border-radius:8px;max-width:100%;width:150px}.big{font-size:32px;font-weight:900}.grid3{display:grid;grid-template-columns:repeat(3, minmax(60px,100px));gap:8px}.cell{height:80px;font-size:30px;background:#25274b;color:white;border:1px solid #555581}.board{display:grid;grid-template-columns:repeat(4,65px);gap:6px}.tile{height:65px;background:#282a4d;color:white;border-radius:8px;font-size:22px}.status{padding:10px;border-radius:10px;background:#0a0c20;color:var(--cyan);margin:10px 0}.hide{display:none}footer{padding:25px 0;color:var(--muted);font-size:13px}@media(max-width:800px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}.cell{height:68px}.board{grid-template-columns:repeat(4, minmax(45px,65px))}.tile{height:55px}}
</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">GAME<span>ZONE</span></a><a href="index.html">← Home</a></header><h1>PLAY <span style="color:var(--cyan)">MINI GAMES</span></h1><p class="muted">Game चुनो और इसी वेबसाइट पर खेलो — मोबाइल पर भी काम करता है। अभी 12 playable mini-games हैं; आगे और जोड़े जा सकते हैं।</p><div id="games" class="games"></div>
<section id="panel" class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 id="title" style="margin:0">Game</h2><button id="close">← Games list</button></div><div id="status" class="status">Ready!</div><div id="area" class="gamearea"></div></section><footer>Gamezone · Original browser mini-games. Coins, deposits और real-money betting इसमें नहीं हैं.</footer></div>
<script>
const games=[
['🔢','Number Guess','guess'],['✂️','Rock Paper Scissors','rps'],['⭕','Tic Tac Toe','ttt'],['🧠','Memory Match','memory'],['⚡','Reaction Test','reaction'],['➕','Math Sprint','math'],['🎯','Tap the Target','tap'],['🟩','2048 Mini','2048'],['🐍','Snake','snake'],['🎨','Color Match','color'],['🪙','Heads or Tails','coin'],['🔤','Word Scramble','word']
];const $=id=>document.getElementById(id);const root=$('games');games.forEach(([icon,name,id])=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="emoji">'+icon+'</div><b>'+name+'</b><button class="btn">PLAY ▶</button>';c.querySelector('button').onclick=()=>start(id,name);root.append(c)});
$('close').onclick=()=>{$('panel').classList.remove('show');root.scrollIntoView({behavior:'smooth'})};
let cleanup=()=>{};function start(id,name){cleanup();cleanup=()=>{};$('panel').classList.add('show');$('title').textContent=name;$('status').textContent='Game शुरू!';$('area').innerHTML='';const a=$('area');const status=t=>$('status').textContent=t;const btn=(txt,fn)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;a.append(b);return b};const el=(tag,txt='')=>{const n=document.createElement(tag);n.textContent=txt;a.append(n);return n};
if(id==='guess'){let n=1+Math.floor(Math.random()*100),tries=0;el('p','1 से 100 के बीच नंबर guess करो।');const inp=el('input');inp.type='number';inp.placeholder='1–100';btn('Guess',()=>{const v=Number(inp.value);tries++;status(!v||v>100||v<1?'1 से 100 तक नंबर डालो।':v===n?'🎉 सही! '+tries+' कोशिशों में!':v<n?'और बड़ा नंबर try करो।':'और छोटा नंबर try करो।')});btn('Restart',()=>start(id,name))}
if(id==='rps'){el('p','अपना move चुनो।');['✊ Rock','✋ Paper','✌️ Scissors'].forEach((x,i)=>btn(x,()=>{let c=Math.floor(Math.random()*3),labels=['Rock','Paper','Scissors'];status('तुम: '+labels[i]+' · Game: '+labels[c]+' — '+(i===c?'Draw!':(i-c+3)%3===1?'You win! 🎉':'Try again!'))}))}
if(id==='ttt'){let b=Array(9).fill(''),turn='X',done=false;const g=el('div');g.className='grid3';function draw(){g.innerHTML='';b.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.textContent=v;x.onclick=()=>{if(done||b[i])return;b[i]=turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(wins.some(w=>w.every(k=>b[k]===turn))){status(turn+' wins!');done=true}else if(b.every(Boolean)){status('Draw! Restart करके फिर खेलो।');done=true}else turn=turn==='X'?'O':'X';if(!done)status('Turn: '+turn);draw()};g.append(x)})}draw();btn('Restart',()=>start(id,name))}
if(id==='memory'){const vals=['🍎','🚀','🐱','⚽','🌈','🎲','🍎','🚀','🐱','⚽','🌈','🎲'].sort(()=>Math.random()-.5);let open=[],matched=0,lock=false;const g=el('div');g.className='grid3';g.style.gridTemplateColumns='repeat(4,minmax(45px,75px))';vals.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.textContent='❔';x.onclick=()=>{if(lock||x.dataset.done||open.some(o=>o.i===i))return;x.textContent=v;open.push({i,v,x});if(open.length===2){lock=true;if(open[0].v===open[1].v){open.forEach(o=>{o.x.dataset.done='1';o.x.disabled=true});matched+=2;open=[];lock=false;status(matched===12?'🎉 सभी pair मिल गए!':'Matches: '+matched+'/12')}else setTimeout(()=>{open.forEach(o=>o.x.textContent='❔');open=[];lock=false},650)}};g.append(x)})}
if(id==='reaction'){el('p','Start दबाओ, फिर हरे रंग का button दिखने पर जल्दी tap करो।');let t=null,armed=false,done=false;const b=btn('START',()=>{if(armed||done)return;armed=true;b.textContent='Wait…';b.style.background='#d94b68';t=setTimeout(()=>{b.textContent='TAP NOW!';b.style.background='#50f5e2';const start=Date.now();b.onclick=()=>{if(!done){done=true;status('Reaction time: '+(Date.now()-start)+' ms');cleanup=()=>clearTimeout(t)}}},1000+Math.random()*2500)});cleanup=()=>clearTimeout(t)}
if(id==='math'){let score=0,left=30,timer;function q(){if(left<=0){status('Time up! Score: '+score);clearInterval(timer);return}let x=1+Math.floor(Math.random()*20),y=1+Math.floor(Math.random()*20),ans=x+y; a.querySelectorAll('p,input,button').forEach(n=>n.remove());el('p',x+' + '+y+' = ?');const inp=el('input');inp.type='number';inp.id='ans';btn('Submit',()=>{if(Number(inp.value)===ans){score++;status('Correct! Score '+score)}else status('Correct answer: '+ans+' · Score '+score);q()})}timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);status('Time up! Score: '+score)}},1000);cleanup=()=>clearInterval(timer);q();status('30 seconds!')}
if(id==='tap'){let score=0,left=15,timer;const p=el('p','15 seconds में target को जितनी बार हो सके tap करो।');const b=btn('🎯 TAP!',()=>{if(left>0){score++;status('Score: '+score+' · Time: '+left+'s')}});timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);b.disabled=true;status('Finished! Final score: '+score)}else p.textContent='Tap fast! '+left+' seconds left'},1000);cleanup=()=>clearInterval(timer)}
if(id==='2048'){let b=Array(16).fill(0);function add(){let z=b.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(z.length)b[z[Math.floor(Math.random()*z.length)]]=2}add();add();const g=el('div');g.className='board';function draw(){g.innerHTML='';b.forEach(v=>{const x=document.createElement('button');x.className='tile';x.textContent=v||'';g.append(x)})}function move(dir){let old=b.join(',');for(let line=0;line<4;line++){let ids=[];for(let k=0;k<4;k++)ids.push(dir==='left'?line*4+k:dir==='right'?line*4+3-k:dir==='up'?k*4+line:(3-k)*4+line);let vals=ids.map(i=>b[i]).filter(Boolean),out=[];for(let k=0;k<vals.length;k++){if(vals[k]===vals[k+1]){out.push(vals[k]*2);k++}else out.push(vals[k])}ids.forEach((i,k)=>b[i]=out[k]||0)}if(old!==b.join(','))add();draw();status('2048 तक पहुंचने की कोशिश करो!')}['← Left','→ Right','↑ Up','↓ Down'].forEach((t,i)=>btn(t,()=>move(['left','right','up','down'][i])));document.onkeydown=e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}};cleanup=()=>document.onkeydown=null;draw()}
if(id==='snake'){let s=[33,32,31],d=1,food=45,score=0,timer;const g=el('div');g.style.cssText='display:grid;grid-template-columns:repeat(10, minmax(15px,28px));gap:2px';function draw(){g.innerHTML='';for(let i=0;i<100;i++){const c=document.createElement('div');c.style.cssText='aspect-ratio:1;background:'+(s.includes(i)?'#50f5e2':i===food?'#ffcc66':'#242644')+';border-radius:3px';g.append(c)}}function tick(){let h=s[0]+d;if(h<0||h>=100||(d===1&&s[0]%10===9)||(d===-1&&s[0]%10===0)||s.includes(h)){clearInterval(timer);status('Game over! Score: '+score+' — Restart दबाओ');return}s.unshift(h);if(h===food){score++;food=Math.floor(Math.random()*100);status('Score: '+score)}else s.pop();draw()}const controls=[['←',-1],['↑',-10],['↓',10],['→',1]];controls.forEach(([t,v])=>btn(t,()=>{if(v!==-d)d===1&&v===-1||d===-1&&v===1||d===10&&v===-10||d===-10&&v===10?null:d=v}));timer=setInterval(tick,250);cleanup=()=>clearInterval(timer);draw()}
if(id==='color'){const colors=['RED','BLUE','GREEN','YELLOW','PURPLE'];let score=0,left=20,timer;function next(){if(left<=0){clearInterval(timer);status('Done! Score: '+score);return}a.querySelectorAll('button').forEach(n=>n.remove());const word=colors[Math.floor(Math.random()*5)],shown=colors[Math.floor(Math.random()*5)];el('p','Text क्या कह रहा है?');const h=el('div',word);h.className='big';h.style.color=shown.toLowerCase()==='yellow'?'#ffe45c':shown.toLowerCase()==='green'?'#45e58a':shown.toLowerCase()==='blue'?'#60a5fa':shown.toLowerCase()==='purple'?'#c4a1ff':'#ff5c72';colors.forEach(c=>btn(c,()=>{if(c===word)score++;next()}))}timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);status('Time up! Score: '+score)}},1000);cleanup=()=>clearInterval(timer);next()}
if(id==='coin'){btn('Flip coin 🪙',()=>{const v=Math.random()<.5?'Heads 🟡':'Tails 🔵';status(v)});el('p','सिर्फ fun के लिए — कोई पैसे या betting नहीं।')}
if(id==='word'){const words=['PLANET','GARDEN','PUZZLE','ORANGE','ROCKET','SCHOOL'];let word=words[Math.floor(Math.random()*words.length)],mix=word.split('').sort(()=>Math.random()-.5).join('');el('p','Letters को सही करके word बनाओ:');el('div',mix).className='big';const inp=el('input');inp.placeholder='Your answer';btn('Check',()=>status(inp.value.trim().toUpperCase()===word?'🎉 Correct!':'Try again! Hint: '+word.length+' letters'));btn('New word',()=>start(id,name))}
$('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
</script></body></html>
