ystem-ui;background:#080916;color:white;padding:24px"><h2>Access status जाँच नहीं सका</h2><p>Supabase table/policy जाँचें।</p><a style="color:#50f5e2" href="pay.html">Payment / Access</a></main>';return}if(!r.data){location.replace("pay.html?locked=1");return}document.body.style.visibility="visible"})();</script><div class="top"><a href="index.html">← GAMEZONE</a><span style="color:#53ff75">RACING</span></div><h1>🏎️ Racing <span style="color:#53ff75">Game</span></h1><p class="sub">बाएँ-दाएँ बटन से कार चलाओ और दूसरी गाड़ियों से बचो।</p><div id="hud">Score: 0 · Speed: 1</div><canvas id="c" width="360" height="520"></canvas><div class="controls"><button id="left">⬅️ LEFT</button><button id="right">RIGHT ➡️</button></div><button class="reset" onclick="start()">🔄 Restart Race</button><script>const c=document.querySelector('#c'),x=c.getContext('2d');let car,obs,score,speed,over,held={l:false,r:false},last=0,raf;function down(k,v){held[k]=v}for(const [id,k] of [['left','l'],['right','r']]){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();down(k,true)};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>down(k,false)))}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')held.l=true;if(e.key==='ArrowRight'||e.key==='d')held.r=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')held.l=false;if(e.key==='ArrowRight'||e.key==='d')held.r=false});function start(){cancelAnimationFrame(raf);car={x:160,y:425,w:38,h:65};obs=[];score=0;speed=3;over=false;last=0;held.l=held.r=false;raf=requestAnimationFrame(loop)}function drawCar(a,color){x.fillStyle=color;x.fillRect(a.x,a.y,a.w,a.h);x.fillStyle='#bfe8ff';x.fillRect(a.x+6,a.y+9,a.w-12,15);x.fillStyle='#161616';x.fillRect(a.x-4,a.y+8,5,16);x.fillRect(a.x+a.w-1,a.y+8,5,16);x.fillRect(a.x-4,a.y+42,5,16);x.fillRect(a.x+a.w-1,a.y+42,5,16);x.fillStyle='#ffe36b';x.fillRect(a.x+4,a.y+2,7,4);x.fillRect(a.x+a.w-11,a.y+2,7,4)}function loop(t){let dt=Math.min((t-last||16)/16,2);last=t;x.fillStyle='#28613a';x.fillRect(0,0,360,520);x.fillStyle='#3a3a40';x.fillRect(35,0,290,520);x.fillStyle='#fff';for(let y=-30+(t/8%70);y<520;y+=70){x.fillRect(128,y,5,38);x.fillRect(228,y,5,38)}x.fillStyle='#f2cf55';x.fillRect(40,0,4,520);x.fillRect(316,0,4,520);if(!over){if(held.l)car.x-=5*dt;if(held.r)car.x+=5*dt;car.x=Math.max(47,Math.min(275,car.x));if(Math.random()<.025*dt)obs.push({x:55+Math.floor(Math.random()*5)*50,y:-75,w:36,h:60,color:['#e84b4b','#53b8ff','#e9d85b'][Math.floor(Math.random()*3)]});obs.forEach(o=>o.y+=speed*dt);obs=obs.filter(o=>o.y<540);for(const o of obs)if(car.x<o.x+o.w-5&&car.x+car.w>o.x+5&&car.y<o.y+o.h-5&&car.y+car.h>o.y+5)over=true;score+=dt*.12;speed=Math.min(8,3+score/30)}obs.forEach(o=>drawCar(o,o.color));drawCar(car,'#53ff75');document.querySelector('#hud').textContent='Score: '+Math.floor(score)+' · Speed: '+speed.toFixed(1);if(over){x.fillStyle='#000b';x.fillRect(0,0,360,520);x.fillStyle='white';x.textAlign='center';x.font='bold 30px system-ui';x.fillText('RACE OVER',180,240);x.font='18px system-ui';x.fillText('Score: '+Math.floor(score),180,275);x.fillText('Restart dabao',180,310);return}raf=requestAnimationFrame(loop)}start()</script></body></html>
