
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gamezone 3D Battle</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#80bce8;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;background:#10251bdc;color:white;padding:10px;border-radius:10px;z-index:2;line-height:1.7;font-weight:bold}
#hint{position:fixed;right:10px;top:10px;color:white;background:#10251bdc;padding:8px;border-radius:8px;font-size:11px;z-index:2}
#joy{position:fixed;bottom:22px;left:20px;width:120px;height:120px;border:2px solid #ffffff99;background:#ffffff30;border-radius:50%;z-index:3}
#stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#ffffffcc}
#fire{position:fixed;bottom:30px;right:22px;width:85px;height:85px;border-radius:50%;background:#d83225;color:white;border:3px solid white;font-weight:bold;font-size:16px;z-index:3}
#msg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);color:white;text-align:center;font-size:25px;font-weight:bold;text-shadow:2px 2px 4px black;z-index:4;pointer-events:none}
#restart{display:none;position:fixed;top:57%;left:50%;transform:translateX(-50%);padding:13px 22px;background:#ffdc50;border:0;border-radius:8px;font-weight:bold;z-index:5}
</style>
</head>
<body style="visibility:hidden">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (async function requireGamezoneLogin() {
    const authClient = window.supabase.createClient(
      "https://piruzvmqftjksjrnkvhb.supabase.co",
      "sb_publishable_01DcZheYmg7UCsQdDmXMdQ_mRXAtrus"
    );
    const { data, error } = await authClient.auth.getSession();
    if (error || !data.session) {
      window.location.replace("login.html");
      return;
    }
    document.body.style.visibility = "visible";
  })();
</script>
<div id="hud">❤️ HP: <span id="hp">100</span><br>🎯 Kills: <span id="kills">0</span></div>
<div id="hint">RIGHT SIDE DRAG = AIM</div>
<div id="msg">GAMEZONE 3D<br><small>Tap to start</small></div>
<div id="joy"><div id="stick"></div></div>
<button id="fire">FIRE 🔥</button>
<button id="restart">PLAY AGAIN</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const msg=document.getElementById('msg');
if(!window.THREE){msg.innerHTML='Internet required<br><small>Reload the game</small>';return;}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ac7ed);
scene.fog=new THREE.Fog(0x8ac7ed,45,140);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53684a,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,35,10);scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});
const grass=material(0x568849),trunk=material(0x67462c);
const leaves=material(0x24633b),wall=material(0xc4b18a);
const roof=material(0x704b3b),blue=material(0x276bc2);
const red=material(0xa82f35),skin=material(0xe3b58d);
const dark=material(0x252a30);
function box(parent,w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);parent.add(o);return o;
}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(220,220),grass);
floor.rotation.x=-Math.PI/2;floor.position.y=-.1;scene.add(floor);
function tree(x,z){
 const g=new THREE.Group();
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,2,6),trunk);
 t.position.y=1;g.add(t);
 const l=new THREE.Mesh(new THREE.ConeGeometry(1.4,3.2,7),leaves);
 l.position.y=3;g.add(l);g.position.set(x,0,z);scene.add(g);
}
function house(x,z){
 const g=new THREE.Group();
 box(g,5,3,4,wall,0,1.5,0);
 const r=new THREE.Mesh(new THREE.ConeGeometry(3.8,1.8,4),roof);
 r.rotation.y=Math.PI/4;r.position.y=4;g.add(r);
 box(g,1,1.8,.12,dark,0,.9,2.06);
 g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<75;i++){
 const x=Math.random()*170-85,z=Math.random()*170-85;
 if(Math.hypot(x,z)>12)tree(x,z);
}
house(-13,-20);house(18,-28);house(28,15);house(-30,25);
function soldier(isEnemy=false){
 const g=new THREE.Group(),c=isEnemy?red:blue;
 box(g,.8,1.05,.45,c,0,1.45,0);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),skin);
 head.position.y=2.25;g.add(head);
 for(const s of [-1,1]){
  box(g,.27,.8,.32,dark,s*.23,.48,0);
  box(g,.22,.8,.25,c,s*.52,1.55,0);
 }
 box(g,.18,.18,1.05,dark,.35,1.65,-.6);
 scene.add(g);return g;
}
let player,enemies=[],bullets=[],hp=100,kills=0,over=false;
let yaw=0,moveX=0,moveY=0,shooting=false,lastShot=0,spawn=0;
function reset(){
 if(player)scene.remove(player);
 enemies.forEach(e=>scene.remove(e));bullets.forEach(b=>scene.remove(b.mesh));
 enemies=[];bullets=[];hp=100;kills=0;over=false;yaw=0;spawn=0;
 player=soldier(false);player.position.set(0,0,0);
 document.getElementById('hp').textContent=hp;
 document.getElementById('kills').textContent=kills;
 msg.style.display='none';document.getElementById('restart').style.display='none';
}
function addEnemy(){
 const a=Math.random()*Math.PI*2;
 const e=soldier(true);
 e.position.set(player.position.x+Math.sin(a)*24,0,player.position.z+Math.cos(a)*24);
 e.userData.hp=2;enemies.push(e);
}
function fire(){
 const now=performance.now();if(now-lastShot<260||over)return;lastShot=now;
 const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.13,6,6),material(0xffdf52));
 mesh.position.copy(player.position).add(new THREE.Vector3(0,1.6,0)).addScaledVector(dir,1.2);
 scene.add(mesh);bullets.push({mesh,dir,life:1.4});
}
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
let joyId=null;
function joyMove(e){
 const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,max=35;
 const x=dx/d*Math.min(d,max),y=dy/d*Math.min(d,max);
 moveX=x/max;moveY=y/max;stick.style.left=(34+x)+'px';stick.style.top=(34+y)+'px';
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
function joyStop(){joyId=null;moveX=moveY=0;stick.style.left='34px';stick.style.top='34px'}
joy.addEventListener('pointerup',joyStop);joy.addEventListener('pointercancel',joyStop);
const fireBtn=document.getElementById('fire');
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();shooting=true;fire()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>fireBtn.addEventListener(ev,()=>shooting=false));
let aiming=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX>innerWidth*.35){aiming=true;lastX=e.clientX}
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(aiming){yaw-=(e.clientX-lastX)*.009;lastX=e.clientX}
});
renderer.domElement.addEventListener('pointerup',()=>aiming=false);
renderer.domElement.addEventListener('pointercancel',()=>aiming=false);
document.getElementById('restart').onclick=reset;
function update(dt){
 if(over)return;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 player.position.addScaledVector(forward,-moveY*7*dt);
 player.position.addScaledVector(right,moveX*7*dt);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-100,100);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-100,100);
 player.rotation.y=yaw;
 if(shooting)fire();
 spawn+=dt;if(spawn>3&&enemies.length<8){spawn=0;addEnemy()}
 bullets.forEach(b=>{
  b.mesh.position.addScaledVector(b.dir,32*dt);b.life-=dt;
  for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i];
   if(b.mesh.position.distanceTo(new THREE.Vector3(e.position.x,e.position.y+1.3,e.position.z))<1.05){
    e.userData.hp--;b.life=0;
    if(e.userData.hp<=0){scene.remove(e);enemies.splice(i,1);kills++;document.getElementById('kills').textContent=kills}
    break;
   }
  }
 });
 bullets=bullets.filter(b=>{if(b.life<=0){scene.remove(b.mesh);return false}return true});
 enemies.forEach(e=>{
  const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz)||1;
  if(d>1.7){e.position.x+=dx/d*1.8*dt;e.position.z+=dz/d*1.8*dt}
  e.lookAt(player.position.x,0,player.position.z);
  if(d<1.8){hp-=12*dt;document.getElementById('hp').textContent=Math.max(0,Math.ceil(hp))}
 });
 if(hp<=0){over=true;msg.innerHTML='GAME OVER<br><small>Kills: '+kills+'</small>';msg.style.display='block';document.getElementById('restart').style.display='block'}
}
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);update(dt);
 const target=player.position.clone().add(new THREE.Vector3(0,1.3,0));
 const offset=new THREE.Vector3(Math.sin(yaw)*7,4,-Math.cos(yaw)*7);
 camera.position.copy(target).add(offset);camera.lookAt(target);
 renderer.render(scene,camera);
}
const clock=new THREE.Clock();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
reset();animate();
})();
</script>
</body>
</html>
