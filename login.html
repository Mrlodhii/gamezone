<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d0a">
<title>Gamezone | Login & Sign Up</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#194327,#080d0a 65%);font-family:Arial,sans-serif;color:#fff}
.card{width:100%;max-width:420px;padding:26px;background:#101912;border:1px solid #31563a;border-radius:18px;box-shadow:0 15px 50px #0008}
.logo{text-align:center;font-size:30px;font-weight:900;margin-bottom:5px}
.logo span{color:#53ff75}
.sub{text-align:center;color:#a9b9ac;margin:0 0 25px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#1a281d;color:#fff;font-weight:bold}
.tabs button.active,.submit{background:#53ff75;color:#071109}
label{display:block;margin:14px 0 7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #34513a;border-radius:9px;background:#080d0a;color:#fff;font-size:16px}
input:focus{outline:2px solid #53ff75}
.submit{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;font-weight:bold;font-size:16px}
.submit:disabled{opacity:.6}
#message{font-size:14px;line-height:1.5;overflow-wrap:anywhere;color:#baffc5}
.back{text-align:center;margin-top:22px;font-size:14px}
a{color:#53ff75}
</style>
</head>
<body>
<main class="card">
  <div class="logo">GAME<span>ZONE</span></div>
  <p class="sub">Your game. Your world.</p>

  <div class="tabs">
    <button type="button" id="loginTab" class="active">LOGIN</button>
    <button type="button" id="signupTab">SIGN UP</button>
  </div>

  <form id="authForm">
    <label for="email">Email Address</label>
    <input id="email" type="email" placeholder="you@example.com"
      autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" type="password"
      placeholder="At least 8 characters"
      minlength="8" autocomplete="current-password" required>

    <button class="submit" id="submitBtn" type="submit">LOGIN</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <div class="back"><a href="index.html">← Back to Gamezone</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://piruzvmqftjksjrnkvhb.supabase.co";
const SUPABASE_KEY = "sb_publishable_01DcZheYmg7UCsQdDmXMdQ_mRXAtrus";

const form = document.getElementById("authForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

let mode = "login";
let client = null;
const form = document.getElementById("authForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
function say(text) {
  message.textContent = text;
}

if (window.supabase &&
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("PASTE_") &&
    SUPABASE_KEY &&
    !SUPABASE_KEY.includes("PASTE_")) {
  client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );
} else {
  say("Supabase Project URL aur Publishable Key abhi add karni hai.");
}

function setMode(nextMode) {
  mode = nextMode;
  loginTab.classList.toggle("active", mode === "login");
  signupTab.classList.toggle("active", mode === "signup");
  submitBtn.textContent =
    mode === "login" ? "LOGIN" : "CREATE ACCOUNT";
  passwordInput.autocomplete =
    mode === "login" ? "current-password" : "new-password";
  say("");
}

loginTab.addEventListener("click", () => setMode("login"));
signupTab.addEventListener("click", () => setMode("signup"));

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!client) {
    say("Pehle apna Supabase URL aur Publishable Key add karo.");
    return;
  }

  submitBtn.disabled = true;
  say("Please wait...");

  try {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (mode === "signup") {
      const {data, error} = await client.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo:
            window.location.origin +
            window.location.pathname.replace(/[^/]*$/, "index.html")
        }
      });

      if (error) throw error;

      if (data.session) {
        window.location.href = "index.html";
      } else {
        say("Account request successful! Agar email confirmation on hai, apne email ka confirmation link kholo.");
      }
    } else {
      const {error} = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;
      window.location.href = "index.html";
    }
  } catch (error) {
    say(error.message || "Login nahi ho paya. Dobara try karo.");
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
