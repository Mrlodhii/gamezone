<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080d0a"><title>Memory Match | Gamezone</title><style>*{box-sizing:border-box}body{margin:0;background:#080d0a;color:#f4fff5;font-family:system-ui,Arial;padding:20px;max-width:650px;margin:auto}.green{color:#53ff75}a,button{cursor:pointer}a{color:#53ff75;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center}h1{text-align:center;margin:25px 0 5px}.sub{text-align:center;color:#a9b9ac}.stats{display:flex;justify-content:center;gap:22px;margin:20px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{aspect-ratio:1;border:1px solid #31563a;border-radius:12px;background:#132017;color:#53ff75;font-size:clamp(25px,8vw,42px);font-weight:800}.tile.open,.tile.done{background:#1b4a28}.tile.done{opacity:.6}.actions{text-align:center;margin:22px}button.reset{background:#53ff75;color:#071109;border:0;border-radius:9px;padding:12px 22px;font-weight:800}#msg{text-align:center;color:#53ff75;min-height:28px}</style></head><body><div class="top"><a href="index.html">← GAMEZONE</a><span class="green">MEMORY</span></div><h1>🧠 Memory <span class="green">Match</span></h1><p class="sub">एक जैसे emoji वाले कार्ड ढूँढो!</p><div class="stats"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/8</span></div><div id="board" class="board"></div><p id="msg"></p><div class="actions"><button class="reset" onclick="start()">🔄 Restart</button></div><script>const icons=['🐯','🚀','⚽','🍕','🎮','🐼','⭐','🏆'];let first=null,lock=false,moves=0,pairs=0;function start(){first=null;lock=false;moves=0;pairs=0;document.querySelector('#moves').textContent=0;document.querySelector('#pairs').textContent=0;document.querySelector('#msg').textContent='';let deck=[...icons,...icons].sort(()=>Math.random()-.5);let b=document.querySelector('#board');b.innerHTML='';deck.forEach((v,i)=>{let x=document.createElement('button');x.className='tile';x.textContent='?';x.setAttribute('aria-label','Hidden card');x.onclick=()=>flip(x,v);b.append(x)})}function flip(el,v){if(lock||el.classList.contains('open')||el.classList.contains('done'))return;el.textContent=v;el.classList.add('open');if(!first){first={el,v};return}moves++;document.querySelector('#moves').textContent=moves;if(first.v===v){first.el.classList.replace('open','done');el.classList.replace('open','done');pairs++;document.querySelector('#pairs').textContent=pairs;first=null;if(pairs===8)document.querySelector('#msg').textContent='🎉 शानदार! सारे जोड़े मिल गए!';}else{let prev=first.el;first=null;lock=true;setTimeout(()=>{prev.textContent='?';el.textContent='?';prev.classList.remove('open');el.classList.remove('open');lock=false},700)}}start()</script></body></html>
