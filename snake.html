<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080d0a"><title>Snake | Gamezone</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#080d0a;color:#f4fff5;font-family:system-ui,Arial;max-width:600px;margin:auto}.green{color:#53ff75}a{color:#53ff75;text-decoration:none}.top{display:flex;justify-content:space-between}h1{text-align:center;margin:22px 0 5px}.sub{text-align:center;color:#a9b9ac}#score{text-align:center;font-size:20px;margin:12px}canvas{display:block;width:min(92vw,420px);height:min(92vw,420px);margin:auto;border:1px solid #31563a;border-radius:12px;background:#0c160f;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,62px);gap:8px;justify-content:center;margin:15px auto}.controls button,.reset{background:#132017;border:1px solid #31563a;color:#53ff75;border-radius:10px;font-size:22px;padding:10px}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.actions{text-align:center}.reset{font-size:15px;background:#53ff75;color:#071109;font-weight:800;padding:11px 20px}</style></head><body><div class="top"><a href="index.html">← GAMEZONE</a><span class="green">ARCADE</span></div><h1>🐍 Snake <span class="green">Game</span></h1><p class="sub">खाना खाओ, बड़े बनो और दीवार से बचो। Arrow keys या नीचे के बटन इस्तेमाल करो।</p><div id="score">Score: 0</div><canvas id="c" width="400" height="400"></canvas><div class="controls"><button onclick="dir(0,-1)">⬆️</button><button onclick="dir(-1,0)">⬅️</button><button onclick="dir(0,1)">⬇️</button><button onclick="dir(1,0)">➡️</button></div><div class="actions"><button class="reset" onclick="start()">🔄 Restart</button></div><script>const c=document.querySelector('#c'),ctx=c.getContext('2d'),N=20,S=20;let snake,food,dx,dy,score,timer,dead;function place(){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(snake.some(p=>p.x===food.x&&p.y===food.y))place()}function start(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dx=1;dy=0;score=0;dead=false;document.querySelector('#score').textContent='Score: 0';place();draw();timer=setInterval(tick,140)}function dir(x,y){if(dead||x===-dx&&y===-dy)return;dx=x;dy=y}function tick(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(timer);draw();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 25px system-ui';ctx.fillText('GAME OVER',200,195);ctx.font='16px system-ui';ctx.fillText('Restart dabao',200,225);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.querySelector('#score').textContent='Score: '+score;place()}else snake.pop();draw()}function draw(){ctx.fillStyle='#0c160f';ctx.fillRect(0,0,400,400);ctx.fillStyle='#53ff75';snake.forEach((p,i)=>{ctx.fillStyle=i?'#20bd48':'#8dffa0';ctx.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});ctx.fillStyle='#ff6262';ctx.beginPath();ctx.arc(food.x*S+10,food.y*S+10,8,0,Math.PI*2);ctx.fill()}document.addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))dir(0,-1);if(['ArrowDown','s','S'].includes(e.key))dir(0,1);if(['ArrowLeft','a','A'].includes(e.key))dir(-1,0);if(['ArrowRight','d','D'].includes(e.key))dir(1,0)});start()</script></body></html>
