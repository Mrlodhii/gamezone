<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101326">
<title>Simple Calculator | Gamezone</title>
<style>
:root{color-scheme:dark;--bg:#090b18;--panel:#15182d;--line:#303552;--text:#f5f6ff;--muted:#aeb4d3;--purple:#9b7bff;--cyan:#50f5e2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#25204b 0,transparent 55%),var(--bg);font-family:system-ui,-apple-system,Arial,sans-serif;color:var(--text)}
.wrap{width:min(100%,370px)}.back{display:inline-block;color:var(--cyan);text-decoration:none;margin-bottom:14px;font-size:14px}.calculator{background:rgba(21,24,45,.97);border:1px solid var(--line);padding:18px;border-radius:24px;box-shadow:0 22px 65px #0006}
h1{font-size:22px;margin:0 0 4px}.subtitle{font-size:13px;color:var(--muted);margin:0 0 18px}
.display{width:100%;min-height:94px;padding:16px 13px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:#090b18;color:var(--text);font-size:34px;text-align:right;display:flex;flex-direction:column;justify-content:center;overflow:hidden;overflow-wrap:anywhere}
#previous{font-size:13px;min-height:20px;color:var(--muted)}#current{min-height:42px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{min-height:58px;border:1px solid var(--line);border-radius:13px;background:#222640;color:var(--text);font-size:20px;font-weight:650;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}.utility{color:var(--cyan);background:#172b35}.operator{color:#d5c8ff;background:#2a2347}.equals{background:var(--cyan);color:#08131a;border-color:transparent}.zero{grid-column:span 2}.hint{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html">← Gamezone Home</a>
<section class="calculator" aria-label="Calculator">
<h1>Simple Calculator</h1><p class="subtitle">जोड़, घटाव, गुणा और भाग</p>
<div class="display" aria-live="polite"><div id="previous"></div><div id="current">0</div></div>
<div class="keys">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">DEL</button><button class="operator" data-op="÷">÷</button><button class="operator" data-op="×">×</button>
<button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-op="−">−</button>
<button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-op="+">+</button>
<button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="equals" data-action="equals">=</button>
<button class="zero" data-number="0">0</button><button data-action="decimal">.</button>
</div><p class="hint">बटन दबाकर हिसाब करो</p>
</section>
</main>
<script>
const currentEl=document.getElementById('current'),previousEl=document.getElementById('previous');
let current='0',previous='',operation=null,replaceCurrent=false;
function render(){currentEl.textContent=current;previousEl.textContent=previous?(previous+' '+operation):''}
function addNumber(n){if(replaceCurrent){current=n;replaceCurrent=false}else if(current==='0'){current=n}else if(current.length<15){current+=n}render()}
function decimal(){if(replaceCurrent){current='0.';replaceCurrent=false}else if(!current.includes('.'))current+='.';render()}
function calculate(a,b,op){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?null:a/b;return b}
function chooseOperation(op){if(operation&&!replaceCurrent)equals();previous=current;operation=op;replaceCurrent=true;render()}
function equals(){if(!operation||replaceCurrent)return;const a=Number(previous),b=Number(current),result=calculate(a,b,operation);if(result===null){current='Cannot divide by 0';previous='';operation=null;replaceCurrent=true;render();return}current=String(Number(result.toPrecision(12)));previous='';operation=null;replaceCurrent=true;render()}
function clearAll(){current='0';previous='';operation=null;replaceCurrent=false;render()}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.number!==undefined)addNumber(b.dataset.number);else if(b.dataset.op)chooseOperation(b.dataset.op);else if(b.dataset.action==='decimal')decimal();else if(b.dataset.action==='clear')clearAll();else if(b.dataset.action==='delete'){if(replaceCurrent)return;current=current.length>1?current.slice(0,-1):'0';render()}else if(b.dataset.action==='equals')equals()});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))addNumber(e.key);else if(e.key==='.')decimal();else if(e.key==='+')chooseOperation('+');else if(e.key==='-')chooseOperation('−');else if(e.key==='*')chooseOperation('×');else if(e.key==='/'){e.preventDefault();chooseOperation('÷')}else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Escape')clearAll();else if(e.key==='Backspace'){current=current.length>1?current.slice(0,-1):'0';render()}});
</script>
</body></html>
