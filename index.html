
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamezone Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center}
h1{color:#00f5a0;margin:12px}
#score{font-size:22px;margin:8px}
#road{position:relative;width:280px;height:60vh;min-height:360px;max-height:520px;margin:12px auto;background:#444;border-left:8px solid white;border-right:8px solid white;overflow:hidden}
.line{position:absolute;left:48%;width:6px;height:55px;background:white;animation:move .65s linear infinite}
@keyframes move{from{top:-60px}to{top:100%}}
.car{position:absolute;width:38px;height:64px;border-radius:9px}
#player{bottom:14px;left:calc(50% - 19px);background:#00f5a0;border:3px solid white}
.enemy{top:-70px;background:#ff4757;border:3px solid white}
button{background:#00f5a0;border:0;border-radius:10px;padding:14px 24px;margin:8px;font-size:18px;font-weight:bold}
#message{font-size:20px;margin:10px}
</style>
</head>
<body>
<h1>🏎️ GAMEZONE</h1>
<div id="score">Score: 0</div>
<div id="road">
<div class="line" style="left:33%"></div>
<div class="line" style="left:66%;animation-delay:-.3s"></div>
<div id="player" class="car"></div>
</div>
<div id="message">Avoid the red cars!</div>
<div>
<button id="left">⬅ LEFT</button>
<button id="right">RIGHT ➡</button>
</div>
<button id="start">START / RESTART</button>
<script>
const road=document.getElementById('road');
const player=document.getElementById('player');
const scoreBox=document.getElementById('score');
const message=document.getElementById('message');
let x=121,score=0,running=false,raf=0,last=0,spawn=0,enemies=[];
function move(d){
 if(!running)return;
 x=Math.max(8,Math.min(road.clientWidth-54,x+d*24));
 player.style.left=x+'px';
}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
});
function endGame(){
 running=false;
 cancelAnimationFrame(raf);
 message.textContent='💥 Game Over! Tap Restart to play again.';
}
function start(){
 cancelAnimationFrame(raf);
 enemies.forEach(e=>e.el.remove());
 enemies=[];
 score=0;x=(road.clientWidth-38)/2;
 player.style.left=x+'px';
 scoreBox.textContent='Score: 0';
 message.textContent='Race started! Avoid red cars!';
 running=true;last=performance.now();spawn=0;
 raf=requestAnimationFrame(loop);
}
function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/16,2);last=t;spawn+=dt;
 if(spawn>55){
  spawn=0;
  const el=document.createElement('div');
  el.className='car enemy';
  const ex=8+Math.random()*(road.clientWidth-54);
  el.style.left=ex+'px';road.appendChild(el);
  enemies.push({el,x:ex,y:-70});
 }
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.y+=4*dt;e.el.style.top=e.y+'px';
  if(e.y>road.clientHeight){e.el.remove();enemies.splice(i,1);score++;scoreBox.textContent='Score: '+score;continue}
  if(e.y+58>road.clientHeight-80&&e.y<road.clientHeight-10&&Math.abs(e.x-x)<34){
   endGame();return;
  }
 }
 raf=requestAnimationFrame(loop);
}
document.getElementById('start').onclick=start;
player.style.left=x+'px';
</script>
</body>
</html>
