
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamezone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10121b;
      color: white;
      text-align: center;
    }
    header {
      background: #191d2b;
      padding: 22px;
      font-size: 28px;
      font-weight: bold;
      color: #57ffc1;
    }
    main { padding: 35px 15px; }
    .game {
      background: #202638;
      padding: 22px;
      margin: 15px auto;
      max-width: 320px;
      border-radius: 14px;
    }
    button {
      background: #57ffc1;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>🎮 GAMEZONE</header>
  <main>
    <h1>Welcome to Gamezone!</h1>
    <p>Discover your next favorite game.</p>
    <div class="game">
      <h2>Games Library</h2>
      <p>Your games will appear here.</p>
      <button onclick="alert('Gamezone is ready!')">
        Explore Games
      </button>
    </div>
  </main>
</body>
</html>
