
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamezone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#151d33;color:#56ffbd;font-size:27px;font-weight:bold;text-align:center}
.hero{text-align:center;padding:35px 16px 20px}
.hero h1{font-size:32px;margin:8px 0}
.hero p{color:#b8c4d9}
input{width:90%;max-width:420px;padding:14px;border-radius:10px;border:1px solid #35415d;background:#171f35;color:white;font-size:16px}
h2{text-align:center;margin-top:28px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;padding:16px;max-width:700px;margin:auto}
.card{background:#19233b;border:1px solid #2b3958;border-radius:14px;padding:20px 10px;text-align:center}
.emoji{font-size:42px}
.card h3{margin:12px 0}
button{background:#56ffbd;border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:25px;color:#9caac4}
</style>
</head>
<body>
<header>🎮 GAMEZONE</header>
<section class="hero">
<h1>Play. Explore. Enjoy.</h1>
<p>Your gaming world starts here!</p>
<input id="search" placeholder="🔎 Search games..." oninput="searchGames()">
</section>
<h2>🔥 Explore Games</h2>
<section class="games" id="games">
<div class="card"><div class="emoji">🏎️</div><h3>Racing</h3><button onclick="showInfo('Racing')">Explore</button></div>
<div class="card"><div class="emoji">🧩</div><h3>Puzzle</h3><button onclick="showInfo('Puzzle')">Explore</button></div>
<div class="card"><div class="emoji">🏏</div><h3>Sports</h3><button onclick="showInfo('Sports')">Explore</button></div>
<div class="card"><div class="emoji">🚀</div><h3>Adventure</h3><button onclick="showInfo('Adventure')">Explore</button></div>
</section>
<footer>© 2026 Gamezone | Have fun!</footer>
<script>
function showInfo(name){alert(name+' games coming soon!')}
function searchGames(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
