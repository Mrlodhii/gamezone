<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d0a"><title>Football Challenge | Gamezone</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#080d0a;color:#f4fff5;font-family:system-ui,Arial;max-width:650px;margin:auto}.top{display:flex;justify-content:space-between}.top a{color:#53ff75;text-decoration:none}h1{text-align:center}.sub{text-align:center;color:#a9b9ac}canvas{display:block;width:min(94vw,440px);height:auto;margin:auto;border:1px solid #31563a;border-radius:12px;touch-action:manipulation}.hud{text-align:center;margin:10px;font-weight:bold}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px}.controls button,.reset{border:0;border-radius:10px;background:#53ff75;color:#071109;padding:13px 18px;font-weight:900;font-size:16px}.reset{display:block;margin:10px auto;background:#132017;color:#53ff75;border:1px solid #53ff75}</style></head><body><div class="top"><a href="index.html">← GAMEZONE</a><span style="color:#53ff75">SPORTS</span></div><h1>⚽ Football <span style="color:#53ff75">Challenge</span></h1><p class="sub">Aim चुनो और SHOOT दबाकर गोल करने की कोशिश करो।</p><div class="hud" id="hud">Goals: 0 · Shots: 0</div><canvas id="c" width="360" height="450"></canvas><div class="controls"><button onclick="aim(-1)">⬅️ LEFT</button><button onclick="aim(0)">🎯 CENTER</button><button onclick="aim(1)">RIGHT ➡️</button></div><button class="reset" onclick="shoot()">⚽ SHOOT!</button><button class="reset" onclick="reset()">🔄 Restart Match</button><script>const c=document.querySelector('#c'),x=c.getContext('2d');let goals=0,shots=0,target=0,keeper=0,ball=null,notice='Aim चुनकर SHOOT दबाओ';function draw(){x.fillStyle='#28733d';x.fillRect(0,0,360,450);x.strokeStyle='#ffffffaa';x.lineWidth=3;x.strokeRect(15,15,330,420);for(let i=0;i<9;i++){x.fillStyle=i%2?'#2b7b42':'#28733d';x.fillRect(15,15+i*48,330,48)}x.strokeStyle='white';x.strokeRect(75,35,210,100);x.strokeRect(120,35,120,60);x.strokeStyle='#fff';x.lineWidth=5;x.strokeRect(100,40,160,70);x.fillStyle='#f6f6f6';x.fillRect(104,44,152,62);x.fillStyle='#d9e6ed';x.fillRect(110,49,140,52);x.fillStyle='#e1a77c';x.fillRect(keeper+151,57,28,28);x.fillStyle='#236bc0';x.fillRect(keeper+145,84,40,25);x.fillStyle='#222';x.fillRect(keeper+148,108,12,18);x.fillRect(keeper+170,108,12,18);x.fillStyle='#ffde58';x.beginPath();x.arc(180,390,15,0,Math.PI*2);x.fill();x.fillStyle='#101010';x.beginPath();x.arc(180,390,6,0,Math.PI*2);x.fill();if(ball){x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,10,0,Math.PI*2);x.fill();x.strokeStyle='#222';x.beginPath();x.moveTo(ball.x-7,ball.y-4);x.lineTo(ball.x+7,ball.y+4);x.moveTo(ball.x+5,ball.y-7);x.lineTo(ball.x-5,ball.y+7);x.stroke()}x.fillStyle='white';x.textAlign='center';x.font='bold 16px system-ui';x.fillText(notice,180,440)}function aim(v){target=v;notice=['बाएँ कोना चुना','बीच का निशाना चुना','दायाँ कोना चुना'][v+1];draw()}function shoot(){if(ball)return;shots++;keeper=Math.floor(Math.random()*130)-65;let dest=target===-1?125:target===1?235:180;ball={x:180,y:370,dx:(dest-180)/12,dy:-22,step:0};notice='शॉट जा रहा है…';document.querySelector('#hud').textContent='Goals: '+goals+' · Shots: '+shots;draw();let id=setInterval(()=>{if(!ball){clearInterval(id);return}ball.x+=ball.dx;ball.y+=ball.dy;ball.step++;if(ball.step>11){let saved=Math.abs(ball.x-(keeper+165))<34;let scored=!saved&&ball.x>105&&ball.x<255; if(scored)goals++;notice=scored?'⚽ GOOOAL!':'🧤 बचाव! अगली बार कोशिश करो';ball=null;document.querySelector('#hud').textContent='Goals: '+goals+' · Shots: '+shots;draw();clearInterval(id)}else draw()},35)}function reset(){goals=shots=0;target=0;ball=null;notice='Aim चुनकर SHOOT दबाओ';document.querySelector('#hud').textContent='Goals: 0 · Shots: 0';draw()}draw()</script></body></html>
